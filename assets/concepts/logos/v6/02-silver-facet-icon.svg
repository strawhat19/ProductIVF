<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 368" role="img" aria-labelledby="productivf-title productivf-desc">
  <title id="productivf-title">ProductIVF — Silver facet — V6 rounded dimensional P</title>
  <desc id="productivf-desc">A rounded refinement of the V5 dimensional blue P. A curved bowl and counter, softly rounded stem foot and matching extrusion lead into five rounded blue cubes with the original falling arrangement and fading opacities.</desc>
