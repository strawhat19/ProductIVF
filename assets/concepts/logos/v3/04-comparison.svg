<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="660" viewBox="0 0 1260 660" role="img" aria-labelledby="comparison-title comparison-description">
<title id="comparison-title">ProductIVF V3 — V1 shapes with V2 colors</title>
<desc id="comparison-description">Three original P concepts retain their proportions and block arrangements, with the approved neon blue, black and charcoal palette.</desc>
<rect width="1260" height="660" fill="#070C12"/>
<text x="24" y="48" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#82F7FF">ProductIVF / V3</text>
<text x="24" y="80" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#AAC1CB">V1 shapes + V2 neon palette</text>
<rect x="24" y="110" width="396" height="522" rx="15" fill="#03070D" stroke="#18313C"/>
<text x="44" y="147" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1.2" fill="#00EDFF">01 / DISSOLVING STEM</text>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 304" role="img" aria-labelledby="preview-0-productivf-title preview-0-productivf-desc" x="48" y="164" width="348" height="440" preserveAspectRatio="xMidYMid meet">
  <title id="preview-0-productivf-title">ProductIVF — Dissolving stem — V3 neon palette</title>
  <desc id="preview-0-productivf-desc">The original V1 dissolving stem P geometry and full block arrangement, recolored in luminous cyan-blue, black and charcoal with a restrained glow. Original proportions, block positions and fading opacities are preserved.</desc>
  <defs>
    <linearGradient id="preview-0-productivf-blue" x1="48" y1="28" x2="177" y2="192" gradientUnits="userSpaceOnUse">
      <stop stop-color="#82F7FF" />
      <stop offset=".6" stop-color="#00EDFF" />
      <stop offset="1" stop-color="#008BBA" />
    </linearGradient>
    <filter id="preview-0-productivf-v3-glow" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation=".8" result="soft-light" />
      <feComponentTransfer in="soft-light" result="soft-glow">
        <feFuncA type="linear" slope=".2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="soft-glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect id="preview-0-productivf-v3-background" width="256" height="304" fill="#03070D" />
  <g id="preview-0-productivf-mark" filter="url(#preview-0-productivf-v3-glow)">
    <path id="preview-0-productivf-continuous-p" fill="url(#preview-0-productivf-blue)" fill-rule="evenodd" d="M48 28H126C173 28 198 51 198 87S173 146 126 146H96V167H48ZM96 70V104H124C141 104 150 99 150 87S141 70 124 70Z" />
    <g id="preview-0-productivf-separating-stem">
      <rect x="48" y="173" width="22" height="22" rx="2" fill="#00D9F5" />
      <rect x="75" y="174" width="21" height="21" rx="2" fill="#11161E" stroke="#008BBA" stroke-width=".7" stroke-opacity=".7" />
      <rect x="43" y="204" width="19" height="19" rx="2" fill="#00EDFF" opacity=".8" />
      <rect x="79" y="210" width="17" height="17" rx="2" fill="#008BBA" opacity=".7" />
      <rect x="39" y="237" width="13" height="13" rx="1.5" fill="#008BBA" opacity=".5" />
      <rect x="85" y="245" width="11" height="11" rx="1.5" fill="#82F7FF" opacity=".4" />
      <rect x="58" y="270" width="7" height="7" rx="1" fill="#008BBA" opacity=".22" />
    </g>
  </g>
</svg>
