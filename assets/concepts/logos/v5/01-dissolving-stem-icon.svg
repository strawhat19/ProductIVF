<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 368" role="img" aria-labelledby="productivf-title productivf-desc">
  <title id="productivf-title">ProductIVF — Dissolving stem — V5 thin stem and blue blocks</title>
  <desc id="productivf-desc">The V4 neon P with a 36-unit lower stem, narrowed from 48 units while retaining its long tail and bowl. All seven detached blocks share the same electric blue and retain their positions, sizes and fading opacities.</desc>
  <defs>
    <linearGradient id="productivf-blue" x1="48" y1="28" x2="177" y2="192" gradientUnits="userSpaceOnUse">
      <stop stop-color="#82F7FF" />
      <stop offset=".6" stop-color="#00EDFF" />
      <stop offset="1" stop-color="#008BBA" />
    </linearGradient>
    <filter id="productivf-v5-glow" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation=".8" result="soft-light" />
      <feComponentTransfer in="soft-light" result="soft-glow">
        <feFuncA type="linear" slope=".2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="soft-glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect id="productivf-v5-background" width="256" height="368" fill="#03070D" />
  <g id="productivf-mark" filter="url(#productivf-v5-glow)">
    <path id="productivf-continuous-p" fill="url(#productivf-blue)" fill-rule="evenodd" d="M48 28H126C173 28 198 51 198 87S173 146 126 146H84V231H48ZM96 70V104H124C141 104 150 99 150 87S141 70 124 70Z" />
    <g id="productivf-separating-stem" transform="translate(0 64)">
      <rect x="48" y="173" width="22" height="22" rx="2" fill="#00D9F5" />
      <rect x="75" y="174" width="21" height="21" rx="2" fill="#00D9F5" />
      <rect x="43" y="204" width="19" height="19" rx="2" fill="#00D9F5" opacity=".8" />
      <rect x="79" y="210" width="17" height="17" rx="2" fill="#00D9F5" opacity=".7" />
      <rect x="39" y="237" width="13" height="13" rx="1.5" fill="#00D9F5" opacity=".5" />
      <rect x="85" y="245" width="11" height="11" rx="1.5" fill="#00D9F5" opacity=".4" />
      <rect x="58" y="270" width="7" height="7" rx="1" fill="#00D9F5" opacity=".22" />
    </g>
  </g>
</svg>
